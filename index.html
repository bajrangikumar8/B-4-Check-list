<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Renew Building Check list</title></head><body><header class="topbar"><div><h1>Renew Building Check list</h1><div class="sub">360 Rooms • 9 Works • Live Sync</div></div><div id="syncStatus" class="syncstatus">Connecting…</div></header><main><section id="stats" class="stats"></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search Room"><select id="buildingFilter"><option value="ALL">All Buildings</option><option value="B2">Building 2</option><option value="B3">Building 3</option><option value="B4">Building 4</option></select><select id="partFilter"><option value="ALL">All Parts</option></select><select id="floorFilter"><option value="ALL">All Floors</option><option>Ground</option><option>First</option><option>Second</option><option>Third</option></select><select id="statusFilter"><option value="ALL">All Status</option><option>Pending</option><option>In Progress</option><option>Done</option><option>Not Started</option></select></div><div id="floorCards" class="floorcards"></div></section><section class="panel"><div class="section-head"><h2>Rooms</h2><span id="roomCount"></span></div><div id="rooms" class="rooms"></div></section><section class="panel actions"><h2>Reports & Backup</h2><div class="actiongrid"><button id="excelBtn">⬇ Download Excel</button><button id="summaryBtn">📊 Summary</button><button id="pendingBtn">⚠ Pending Report</button><button id="workerBtn">👷 Worker Report</button><button id="backupBtn">💾 Backup Data</button><label class="buttonlike">♻ Restore Data<input id="restoreInput" type="file" accept=".json,application/json" hidden></label><button id="clearBtn" class="danger">Clear All Data</button></div></section></main><div id="modal" class="modal hidden">
