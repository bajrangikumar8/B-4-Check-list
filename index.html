<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>104 Room Work Checklist</title></head><body><header class="topbar"><div><h1>104 Room Checklist</h1><div class="sub">4 Floors • 26 Rooms/Floor • 9 Works</div></div></header><main><section id="stats" class="stats"></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search Room e.g. G-01"><select id="floorFilter"><option value="ALL">All Floors</option><option>Ground</option><option>First</option><option>Second</option><option>Third</option></select><select id="statusFilter"><option value="ALL">All Status</option><option>Pending</option><option>In Progress</option><option>Done</option><option>Not Started</option></select></div><div id="floorCards" class="floorcards"></div></section><section class="panel"><div class="section-head"><h2>Rooms</h2><span id="roomCount"></span></div><div id="rooms" class="rooms"></div></section><section class="panel actions"><h2>Reports & Backup</h2><div class="actiongrid"><button id="excelBtn">⬇ Download Excel</button><button id="summaryBtn">📊 Summary</button><button id="pendingBtn">⚠ Pending Report</button><button id="workerBtn">👷 Worker Report</button><button id="backupBtn">💾 Backup Data</button><label class="buttonlike">♻ Restore Data<input id="restoreInput" type="file" accept=".json,application/json" hidden></label><button id="clearBtn" class="danger">Clear All Data</button></div></section></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><div><h2 id="modalTitle"></h2><small id="modalPct"></small></div><button id="closeModal" class="close">×</button></div><div id="tasks"></div><div class="modalfoot"><button id="saveRoom" class="primary">Save Room</button></div></div></div><script src="app.js"></script></body></html>
